<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salutation et Ligne Graphique</title>
    
    <!-- Importation de la police Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --gradient-start: #3b82f6;
            --gradient-end: #8b5cf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 3rem 4rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
            text-align: center;
            max-width: 500px;
            width: 100%;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.08), 0 2px 5px rgba(0, 0, 0, 0.03);
        }

        .greeting-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .greeting-subtitle {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .ligne-graphique-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 2rem 0;
        }

        .ligne-graphique {
            height: 6px;
            width: 0; /* Initialement à 0 pour l'animation */
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end), #ec4899);
            background-size: 200% 200%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            animation: 
                expandWidth 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                gradientShift 4s ease infinite;
        }

        @keyframes expandWidth {
            0% { width: 0; opacity: 0; }
            100% { width: 80%; opacity: 1; }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 600px) {
            .card {
                padding: 2.5rem 1.5rem;
            }
            .greeting-title {
                font-size: 2rem;
            }
            .ligne-graphique {
                animation: 
                    expandWidthMobile 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                    gradientShift 4s ease infinite;
            }
        }

        @keyframes expandWidthMobile {
            0% { width: 0; opacity: 0; }
            100% { width: 100%; opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Message de salutation -->
        <h1 class="greeting-title">Bonjour !</h1>
        
        <!-- La ligne graphique demandée -->
        <div class="ligne-graphique-container">
            <div class="ligne-graphique"></div>
        </div>
        
        <!-- Texte d'accompagnement -->
        <p class="greeting-subtitle">
            Bienvenue sur cette page de démonstration. Nous espérons que vous apprécierez la pureté du design et la douceur de notre ligne graphique animée.
        </p>
    </div>
    <title>Ma Page Web</title>
    <link rel="stylesheet" href="css/ligne.css">
</head>

</html>
